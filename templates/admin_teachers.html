<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="center">
<div class="card wide" style="margin-top:40px;">

  <div class="view-top">
    <span class="view-title">Teachers</span>
    <span class="count-badge" id="count">Loading...</span>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Teacher ID</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>
</div>

<script>
function load() {
  fetch('/get-teachers').then(r=>r.json()).then(d=>{
    document.getElementById('count').textContent = d.length + ' teachers';
    document.getElementById('tbody').innerHTML = d.map((x,i)=>`
      <tr>
        <td style="color:var(--t4); font-size:0.82rem;">${i+1}</td>
        <td><span class="pill pill-blue">${x.roll}</span></td>
        <td style="text-align:right;">
           <button onclick="changePass('${x.roll}')" style="padding:4px 8px; font-size:0.75rem; border-radius:4px; border:none; background:var(--bg-input); color:var(--t2); cursor:pointer; margin-right:5px;">Change Pass</button>
           <button onclick="delTch('${x.roll}')" style="padding:4px 8px; font-size:0.75rem; border-radius:4px; border:none; background:#fee2e2; color:#ef4444; cursor:pointer;">Delete</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="3" style="text-align:center;padding:32px;color:var(--t4);">No teachers found</td></tr>';
  });
}

function delTch(roll) {
  if(confirm(`Delete teacher ${roll}?`)) {
    fetch('/admin/delete-teacher', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({roll: roll})
    }).then(()=>load());
  }
}

function changePass(roll) {
  let newPass = prompt("Enter new password for " + roll + ":");
  if(newPass) {
    fetch('/admin/change-password', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({roll: roll, password: newPass})
    }).then(()=>alert("Password updated!"));
  }
}
load();
</script>
