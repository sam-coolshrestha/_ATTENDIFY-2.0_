<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Session — Attendify</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="card" style="margin: 40px auto; max-width: 500px;">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    </div>
    <span class="brand-name">Start <span>Session</span></span>
  </div>

  <p class="page-title">Start Attendance Session</p>
  <p class="page-sub">Students must lock into the portal before you reveal the code.</p>

  <div class="field">
    <label class="field-label">Subject</label>
    <select id="subject"></select>
  </div>
  <div class="field">
    <label class="field-label">Duration (seconds)</label>
    <input id="duration" placeholder="e.g. 300" type="number" min="30">
  </div>

  <button onclick="start()" id="startBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Start Background Session
  </button>

  <div id="code-wrap" style="display:none; margin-top:22px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--r); padding:20px; text-align:center;">
    <p style="font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--t3); margin-bottom:8px;">Session Code</p>
    
    <p id="codeDisplay" style="font-size:2.4rem; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--t4); letter-spacing:6px;">****</p>
    
    <button id="revealBtn" onclick="revealCode()" style="background:#10b981; color:white; margin: 10px auto; width: auto; padding: 6px 12px; font-size:0.85rem;">👁️ Reveal Code</button>
    
    <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">
    
    <h3 style="margin-bottom:10px; font-size:1.1rem;">Live Count: <span id="liveCount" style="color:var(--blue); font-weight:bold;">0</span></h3>
    <ul id="studentList" style="max-height: 150px; overflow-y: auto; margin-bottom:20px; padding:0; list-style:none; text-align:left; font-size:0.85rem; color:var(--t2);"></ul>
    
    <div id="activeControls" style="display:flex; gap:10px;">
       <button onclick="endSession()" style="flex:2; margin:0; padding:10px; background:#2563eb; color:#fff;">End Session & Unlock</button>
       <button onclick="deleteSession()" style="flex:1; margin:0; padding:10px; background:#64748b; color:#fff;">Delete (Mistake)</button>
    </div>
    
    <div id="postSessionControls" style="display:none; margin-top:15px;">
       <button onclick="markAllAbsent()" style="width:100%; margin:0; background:#ef4444; color:#fff; font-weight:bold;">⚠️ ALL ABSENT</button>
    </div>
  </div>
</div>

<script>
let currentCode = "";
let pollingInterval;

async function load(){
  const res = await fetch('/my-subjects');
  const d = await res.json();
  subject.innerHTML = d.length === 0 ? '<option disabled>No subjects assigned</option>' : d.map(s=>`<option>${s.name}</option>`).join('');
}
load();

async function start(){
  const res = await fetch('/start-session',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ subject: subject.value, duration: duration.value })
  });
  const d = await res.json();
  currentCode = d.code;
  
  document.getElementById('code-wrap').style.display = 'block';
  document.getElementById('startBtn').style.display = 'none';
  
  pollingInterval = setInterval(fetchLiveData, 2000);
}

// UPDATED: Reveal code and lock the portal for new students
async function revealCode() {
    // 1. Notify backend to lock the portal
    const res = await fetch(`/reveal-code/${currentCode}`, { method: 'POST' });
    const data = await res.json();

    if(data.status) {
        // 2. Display the code locally
        document.getElementById('codeDisplay').textContent = currentCode;
        document.getElementById('codeDisplay').style.color = "var(--blue)";
        document.getElementById('revealBtn').style.display = "none";
    } else {
        alert("Error locking portal. Please try again.");
    }
}

function fetchLiveData() {
    fetch(`/live-attendance/${currentCode}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById("liveCount").innerText = data.count;
            const listElement = document.getElementById("studentList");
            listElement.innerHTML = ""; 
            data.students.forEach(roll => {
                let li = document.createElement("li");
                li.style.padding = "4px 0";
                li.style.borderBottom = "1px solid var(--border)";
                li.innerText = "✓ " + roll;
                listElement.appendChild(li);
            });
        });
}

function endSession() {
    fetch(`/end-session/${currentCode}`, { method: 'POST' }).then(() => {
        alert("Session ended. Portal is unlocked for students.");
        clearInterval(pollingInterval);
        document.getElementById("activeControls").style.display = "none";
        document.getElementById("postSessionControls").style.display = "block";
    });
}

function deleteSession() {
    if(confirm("Are you sure? This will delete the session and its attendance.")) {
        fetch(`/delete-session/${currentCode}`, { method: 'POST' }).then(() => {
            window.location.reload();
        });
    }
}

function markAllAbsent() {
    if(confirm("🚨 WARNING: Delete ALL attendance for this session?")) {
        fetch(`/all-absent/${currentCode}`, { method: 'POST' }).then(() => {
            alert("Everyone marked absent.");
            document.getElementById("liveCount").innerText = "0";
            document.getElementById("studentList").innerHTML = "";
        });
    }
}
</script>

</body>
</html>
