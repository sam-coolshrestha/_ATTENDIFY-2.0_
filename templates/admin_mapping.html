<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="center">
<div class="card wide" style="margin-top:40px;">

  <div class="view-top">
    <span class="view-title">Subject Mapping</span>
    <span class="count-badge" id="count">Connecting...</span>
  </div>

  <div id="list">
    <p style="text-align:center; padding:32px; color:var(--t4);">Loading subject mappings...</p>
  </div>

</div>
</div>

<script>
function loadMapping() {
  fetch('/get-mapping')
    .then(r => {
      if (!r.ok) throw new Error("Network response was not ok");
      return r.json();
    })
    .then(d => {
      const listDiv = document.getElementById('list');
      document.getElementById('count').textContent = d.length + ' subjects';

      if (!d || d.length === 0) {
        listDiv.innerHTML = '<p style="text-align:center;padding:32px;color:var(--t4);">No mappings found. Please assign teachers or students.</p>';
        return;
      }

      listDiv.innerHTML = d.map(x => `
        <div class="mapping-card" style="border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 15px;">
          <div class="mapping-name" style="font-weight: 700; font-size: 1.1rem; color: var(--blue); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px;">
            ${x.name}
          </div>
          
          <div class="mapping-row" style="display: flex; align-items: center; margin-bottom: 8px;">
            <span class="mk" style="width: 100px; font-weight: 600; color: var(--t3); font-size: 0.85rem;">Teacher:</span>
            <span class="mv">
              ${x.teacher 
                ? `<span class="pill pill-blue">${x.teacher}</span>` 
                : '<span style="color:var(--t4); font-size: 0.85rem;">Not assigned</span>'}
            </span>
          </div>

          <div class="mapping-row" style="display: flex; align-items: flex-start;">
            <span class="mk" style="width: 100px; font-weight: 600; color: var(--t3); font-size: 0.85rem; margin-top: 4px;">Students:</span>
            <span class="mv" style="display: flex; flex-wrap: wrap; gap: 5px; flex: 1;">
              ${x.students && x.students.length > 0
                ? x.students.map(s => `<span class="pill pill-green" style="font-size: 0.75rem;">${s}</span>`).join('')
                : '<span style="color:var(--t4); font-size: 0.85rem;">None enrolled</span>'
              }
            </span>
          </div>
        </div>
      `).join('');
    })
    .catch(err => {
      console.error("Mapping fetch error:", err);
      document.getElementById('list').innerHTML = `<p style="text-align:center;padding:32px;color:red;">Error loading data. Please check if the server is running.</p>`;
    });
}

// Initial load
loadMapping();
</script>
