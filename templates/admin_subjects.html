<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="center">
<div class="card wide" style="margin-top:40px;">

  <div class="view-top">
    <span class="view-title">Subjects</span>
    <span class="count-badge" id="count">Loading...</span>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Subject Name</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>
</div>

<script>
function load() {
  fetch('/get-subjects').then(r=>r.json()).then(d=>{
    document.getElementById('count').textContent = d.length + ' subjects';
    document.getElementById('tbody').innerHTML = d.map((x,i)=>`
      <tr>
        <td style="color:var(--t4); font-size:0.82rem;">${i+1}</td>
        <td style="font-weight:600; color:var(--t1);">${x.name}</td>
        <td style="text-align:right;">
           <button onclick="delSub('${x.name}')" style="padding:4px 8px; font-size:0.75rem; border-radius:4px; border:none; background:#fee2e2; color:#ef4444; cursor:pointer;">Delete</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="3" style="text-align:center;padding:32px;color:var(--t4);">No subjects found</td></tr>';
  });
}

function delSub(name) {
  if(confirm(`Delete ${name} and ALL related attendance?`)) {
    fetch('/admin/delete-subject', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name})
    }).then(()=>load());
  }
}
load();
</script>
