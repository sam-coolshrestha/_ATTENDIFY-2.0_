<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Attendance — Attendify</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="card wide" style="margin: 40px auto; max-width: 580px;">

  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <span class="brand-name">My <span>Attendance</span></span>
  </div>

  <p class="page-title">Attendance Report</p>
  <p class="page-sub">Subject-wise attendance percentage for <b id="displayRoll">{{ session.get('user', '') }}</b></p>

  <div id="results" style="margin-top:22px;">
     <p style="text-align:center; color:var(--t4);">Loading records...</p>
  </div>
  
  <div style="text-align: center; margin-top: 25px;">
    <button onclick="window.location.href='/student_dashboard'" style="background: var(--bg-input); color: var(--t1); border: 1px solid var(--border); box-shadow: none; width: auto; padding: 0 20px;">
        Back to Dashboard
    </button>
  </div>

</div>

<script>
// Automatically fetch on page load
window.onload = async function() {
  const userRoll = "{{ session.get('user', '') }}";
  if(!userRoll) {
      document.getElementById('results').innerHTML = '<p style="text-align:center;color:red;">Error: Not logged in.</p>';
      return;
  }

  const res = await fetch('/student-percentage/' + userRoll);
  const data = await res.json();

  if(!data.length){
    document.getElementById('results').innerHTML = '<p style="text-align:center;color:var(--t4);padding:24px 0;font-size:0.88rem;">No attendance records found.</p>';
    return;
  }

  document.getElementById('results').innerHTML = `
    <table class="data-table">
      <thead>
        <tr>
          <th>Subject</th>
          <th style="text-align:right;">Attendance</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(d => {
          const pct = parseFloat(d.percentage);
          const color = pct >= 75 ? 'pill-green' : pct >= 50 ? 'pill-blue' : 'pill-gray';
          return `<tr>
            <td style="font-weight:600; color:var(--t1);">${d.subject}</td>
            <td style="text-align:right;"><span class="pill ${color}">${d.percentage}%</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}
</script>

</body>
</html>
